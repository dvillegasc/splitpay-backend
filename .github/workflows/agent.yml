name: Agente Autónomo SplitPay (Backend)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splitpay-backend-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splitpay
          POSTGRES_PASSWORD: splitpay
          POSTGRES_DB: splitpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg2://splitpay:splitpay@localhost:5432/splitpay_test
      SECRET_KEY: ci-secret-solo-para-pruebas
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependencias (proyecto + cliente de Gemini)
        run: pip install -r requirements.txt google-genai

      - name: Identidad de Git
        run: |
          git config user.name 'splitpay-agent[bot]'
          git config user.email 'splitpay-agent-bot@users.noreply.github.com'

      - name: Ejecutar el agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.REVIEWER_API_KEY }}
        run: python agent.py
