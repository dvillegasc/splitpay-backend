name: Agentes Autónomos SplitPay (Backend)

on:
  # Desfasado respecto al workflow del frontend (que corre en el minuto 20)
  # para no lanzar 6 llamadas a la misma cuenta gratuita de Gemini en la
  # misma ventana de un minuto.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # max-parallel: 1 — antes los 3 carriles disparaban su primera llamada
      # a Gemini casi en el mismo segundo, reventando el límite de
      # solicitudes por minuto del tier gratuito (evidencia: los logs
      # muestran 5 de 6 llamadas con 429 en una ráfaga de ~30s). Corriendo
      # secuencial, cada carril usa la cuota que dejó libre el anterior.
      max-parallel: 1
      matrix:
        lane: [CORE, TESTS, INFRA]
    concurrency:
      group: splitpay-backend-agent-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del agente
        run: pip install google-genai

      - name: Configurar identidad de Git
        run: |
          git config --global user.name 'splitpay-agent[bot]'
          git config --global user.email 'splitpay-agent-bot@users.noreply.github.com'

      - name: Crear/reiniciar la rama del carril desde main
        run: |
          git fetch origin main
          git checkout -B agent/${{ matrix.lane }} origin/main

      - name: Ejecutar Agente Gemini (carril ${{ matrix.lane }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py "${{ matrix.lane }}"

      - name: Verificar si hubo cambios
        # if: always() — ANTES este paso solo corría si "Ejecutar Agente
        # Gemini" salía con éxito. Con el fix de exit codes, ahora una
        # tarea puede completarse bien (archivo escrito, tasks.md marcado)
        # y la SIGUIENTE fallar por 429 dentro del mismo run: el paso 7
        # termina en código 1 y, sin always(), GitHub Actions se saltaba
        # este paso y todos los siguientes, descartando el trabajo bueno
        # que sí se había hecho. Evidencia real: el carril CORE completó
        # una tarea y la perdió por esto exacto.
        if: always()
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirmar y publicar la rama
        if: always() && steps.check_changes.outputs.changed == 'true'
        run: |
          git commit -m "🤖 [${{ matrix.lane }}] Tareas completadas por el agente"
          git push --force origin agent/${{ matrix.lane }}

      - name: Crear el Pull Request si no existe
        if: always() && steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view agent/${{ matrix.lane }} >/dev/null 2>&1; then
            echo "El PR del carril ${{ matrix.lane }} ya existe; se actualizó con el push anterior."
          else
            gh pr create \
              --base main \
              --head agent/${{ matrix.lane }} \
              --title "🤖 [${{ matrix.lane }}] Tareas del agente autónomo" \
              --body "Generado automáticamente por el agente del carril **${{ matrix.lane }}**. Lo revisará el agente verificador antes de mergear a main."
          fi
