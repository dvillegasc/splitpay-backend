# Configuración principal de Alembic para la gestión de migraciones en SplitPay.

[alembic]
script_location = alembic
prepend_sys_path = .

# La URL de la base de datos se inyectará dinámicamente desde env.py usando la variable de entorno DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/splitpay_db

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
